name: Release

# バージョンタグ (vX.Y.Z) のpushでのみ動作し、C++版RPM (openSUSE Leap 16.0 / Tumbleweed / Fedora 44) と
# QML版KPackageアーカイブをGitHub Releaseとして公開する

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches project version
        # タグ (v0.1.0) とRPM / KPackageのバージョンが食い違ったまま公開しないようにする
        run: |
          version=${TAG#v}
          grep -Eq "^project\(facets VERSION ${version//./\\.} " cpp/CMakeLists.txt
          grep -Eq "^Version:[[:space:]]+${version//./\\.}$" packaging/rpm/facets.spec
          test "$(jq -er '.KPlugin.Version' package/metadata.json)" = "$version"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check RPM GPG config
        # secret未設定でも失敗させず、警告を出して無署名のまま公開する (初回リリース前の安全策)
        id: gpg
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$RPM_GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RPM_GPG_PRIVATE_KEY is not set; RPMs will be published unsigned."
          fi

      - name: Sign RPMs with GPG
        # 署名でRPMの中身が変わるため、SHA256SUMSとAttestationより前に行う
        if: steps.gpg.outputs.enabled == 'true'
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gnupg

          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$RPM_GPG_PASSPHRASE" ]; then
            printf '%s' "$RPM_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          fi
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "RPM_GPG_FPR=$fpr" >> "$GITHUB_ENV"

          # rpmsignはgpgの失敗時も終了コード0を返す場合があるため、後段のrpm -Kで必ず検証する
          rpmsign --addsign --define "_gpg_name $fpr" --define "__gpg $(command -v gpg)" dist/*.rpm
          gpg --batch --armor --export "$fpr" > dist/RPM-GPG-KEY-facets

          rpmdb="$RUNNER_TEMP/rpmdb"
          mkdir -p "$rpmdb"
          rpm --dbpath "$rpmdb" --import dist/RPM-GPG-KEY-facets
          for rpm_file in dist/*.rpm; do
            result=$(rpm --dbpath "$rpmdb" -K "$rpm_file")
            echo "$result"
            case "$result" in
              *"signatures OK"*) ;;
              *) echo "::error::Signature verification failed: $rpm_file"; exit 1 ;;
            esac
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with GPG
        if: steps.gpg.outputs.enabled == 'true'
        run: |
          gpg --batch --yes --local-user "$RPM_GPG_FPR" --armor --detach-sign \
            --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.rpm
            dist/*.tar.gz

      - name: Publish release assets
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
